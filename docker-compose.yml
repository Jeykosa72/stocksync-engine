services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stocksync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stocksync_secret}
      POSTGRES_DB: ${DB_NAME:-stocksync_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stocksync} -d ${DB_NAME:-stocksync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stocksync_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: